name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build
      - name: console syntax
        run: make js
      - name: no secrets
        # Cheap guard; real scanning belongs in a dedicated tool.
        run: |
          ! git grep -nIE '(BEGIN [A-Z ]*PRIVATE KEY|client-key-data:|ghp_[A-Za-z0-9]{30,})' -- ':!*.md' ':!.github'
